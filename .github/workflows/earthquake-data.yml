name: Xuan Quake Earthquake Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xuan-quake-earthquake-data
  cancel-in-progress: false

jobs:
  fetch-earthquakes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch CWA earthquake datasets
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_earthquakes.py

      - name: Commit earthquake data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.json
          if git diff --cached --quiet; then
            echo "No earthquake data changes."
          else
            git commit -m "chore: update CWA earthquake data"
            git push
          fi
