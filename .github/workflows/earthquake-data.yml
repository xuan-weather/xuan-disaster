name: Xuan Disaster Earthquake Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xuan-disaster-earthquake-data
  cancel-in-progress: false

jobs:
  update-earthquakes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch CWA earthquake reports
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_earthquakes.py

      - name: Fetch CWA government weather alerts
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_weather_alerts.py

      - name: Fetch WRA river water levels
        run: python scripts/fetch_river_water_levels.py

      - name: Fetch WRA flood incident information
        run: python scripts/fetch_flood_warnings.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.json data/weather-alerts.json data/river-water-levels.json data/flood-warnings.json
          if git diff --cached --quiet; then
            echo "No earthquake data changes."
          else
            git commit -m "chore: update CWA earthquake reports"
            git push
          fi
